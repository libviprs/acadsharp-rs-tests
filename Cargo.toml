[package]
name = "acadsharp-rs-tests"
version = "0.1.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
license = "MIT"
description = "Test suite and fixtures for acadsharp-rs"
repository = "https://github.com/libviprs/acadsharp-rs-tests"
publish = false
# Matches the floor the rest of the org declares. The `msrv` job pins this
# exact toolchain and fails if this line, the toolchain it installs and the
# README ever disagree.
rust-version = "1.99"

[lints.rust]
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[features]
# Off by default. `emit-acadrust` (R3.2) is the only thing that will use it.
acadrust = ["dep:acadrust"]

[dependencies]
# The crate this suite exists to test. CI lays it down beside this checkout at
# exactly the sha in COUNTERPART_REV, through
# `.github/actions/clone-counterpart`, so `..` is not a guess about anyone's
# directory layout.
#
# By path rather than by git: a git dependency would pin the crate a second
# time, in Cargo.lock, and two pins for one thing drift. The crate's own
# `Suite (acadsharp-rs-tests)` job greps this exact line to check that the suite
# it was handed points back at the crate under test, so keep the spelling on one
# line.
#
# Nothing consumes it yet, because the crate is still scaffolding and no Rust
# here decodes a DWG. `src/lib.rs` carries a `use acadsharp_rs as _;` so that
# stays true without `unused_crate_dependencies` having anything to say about
# it, today or on the day somebody turns that lint on under `-Dwarnings`.
acadsharp-rs = { path = "../acadsharp-rs" }

# The second engine, the fork the parity run's `emit-acadrust` is written
# against. Optional, so a default `cargo test` does not build it, but cargo
# reads the manifest of every path dependency at resolve time, optional or not
# (rust-lang/cargo#4544): `../acadrust` has to be on disk for `cargo metadata`
# to succeed at all, exactly as `../acadsharp-rs` already does. CI lays it down
# at `ACADRUST_REV` through the same action, and `README.md` says what a laptop
# checkout needs. A git dependency would pin it a second time, in a second
# mechanism, and the fork's own Suite job needs a path to test its PR head.
acadrust = { path = "../acadrust", optional = true }

# Parsing fixtures/manifest.toml, which is the single source of truth for the
# corpus. The loader below is the only thing that reads it from Rust.
toml = "0.9"
serde = { version = "1", features = ["derive"] }
# `fixtures::load` verifies a fixture's sha256 before handing back its bytes, so
# hashing is part of the library rather than something each test remembers to do.
sha2 = "0.10"
# Decompressing the frozen reference outputs, which are stored as zstd. Pure
# Rust and decode-only: a C libzstd binding would put a compiler toolchain in
# the way of `cargo test`, and nothing in this crate ever compresses.
ruzstd = "0.9"

# Reading canonical schema 1 (src/canonical.rs). A dependency now, not a dev one:
# the parser and the comparator are library code, and both emitters link them.
#
# `float_roundtrip` is not optional. serde_json's default float parser is fast
# and not correctly rounded: it reads `5.684341886080802E-16` one ulp away from
# the double the oracle wrote, so a stream would not survive a parse, a render
# and a parse. The strict reader has to give back the double that was written.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# Parsing `.github/workflows/ci.yml` and the clone action as YAML rather than as
# text. `tests/counterpart_pin.rs` asserts things about jobs, steps and step
# order, and a regex over YAML answers a different question than the parser the
# runner uses: an assertion that a job "contains" a string passes on a string
# inside a comment, and fails on a perfectly good step written with different
# quoting.
yaml-rust2 = "0.10"

# The adapter binaries. Each is a process, so a reader that aborts on a
# malformed file takes only its own row down. `emit-acadrust` needs the
# `acadrust` feature, because acadrust is optional where acadsharp-rs is not.
[[bin]]
name = "emit-acadrust"
path = "src/bin/emit-acadrust.rs"
required-features = ["acadrust"]
