[package]
name = "acadsharp-rs-tests"
version = "0.1.0"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
license = "MIT"
description = "Test suite and fixtures for acadsharp-rs"
repository = "https://github.com/libviprs/acadsharp-rs-tests"
publish = false
# Matches the floor the rest of the org declares. The `msrv` job pins this
# exact toolchain and fails if this line, the toolchain it installs and the
# README ever disagree.
rust-version = "1.97"

[lints.rust]
deprecated = "deny"

[lints.clippy]
incompatible_msrv = "warn"

[dependencies]
# Parsing fixtures/manifest.toml, which is the single source of truth for the
# corpus. The loader below is the only thing that reads it from Rust.
toml = "0.9"
serde = { version = "1", features = ["derive"] }
# `fixtures::load` verifies a fixture's sha256 before handing back its bytes, so
# hashing is part of the library rather than something each test remembers to do.
sha2 = "0.10"
# Decompressing the frozen reference outputs, which are stored as zstd. Pure
# Rust and decode-only: a C libzstd binding would put a compiler toolchain in
# the way of `cargo test`, and nothing in this crate ever compresses.
ruzstd = "0.9"

[dev-dependencies]
# Reading the frozen reference records back structurally. The suite asserts
# properties of the canonical stream (first record, schema version, at least one
# primitive), and doing that with string matching would pass on a file that is
# not JSON at all.
serde_json = "1"
