# ---- AutoCAD's own DXF (R5.1, #27) ---------------------------------------------------------------
#
# Reader against reader on the DXF, and each reader against itself across the
# container (DXF against DWG) and across the encoding (ASCII against binary). The
# pair key spells which: `dxf:a/b`, `dxf-dwg:e`, `dxf-ascii-binary:e`
# (src/tables.rs). acadsharp-rs has no row: the C ABI opens DWG only, so each of
# its cells is EXCLUDED in parity/VERDICTS.toml, by design.

[[warnings]]
pair = "dxf:oracle/acadrust"
compare = false
reason = "entity_type is an ACadSharp type name for the oracle and a DXF name for acadrust, and the reader notifications are each reader's own."
issue = "libviprs/acadsharp-rs-tests#27"

[[warnings]]
pair = "dxf:ezdxf/oracle"
compare = false
reason = "ezdxf names an entity by its DXF name and warns about different things; the warning stream is not scored against a ground truth."
issue = "libviprs/acadsharp-rs-tests#27"

[[warnings]]
pair = "dxf:ezdxf/acadrust"
compare = false
reason = "ezdxf names an entity by its DXF name and warns about different things; the warning stream is not scored against a ground truth."
issue = "libviprs/acadsharp-rs-tests#27"

[[warnings]]
pair = "dxf-dwg:oracle"
compare = false
reason = "a reader's notifications are about the container it read, so a DXF and a DWG of one drawing do not raise the same ones; the geometry is what is held."
issue = "libviprs/acadsharp-rs-tests#27"

[[warnings]]
pair = "dxf-dwg:acadrust"
compare = false
reason = "a reader's notifications are about the container it read, so a DXF and a DWG of one drawing do not raise the same ones; the geometry is what is held."
issue = "libviprs/acadsharp-rs-tests#27"

[[warnings]]
pair = "dxf-ascii-binary:oracle"
compare = false
reason = "warnings are compared by the per-fixture pairs, as counts per category."
issue = "libviprs/acadsharp-rs-tests#27"

[[warnings]]
pair = "dxf-ascii-binary:acadrust"
compare = false
reason = "warnings are compared by the per-fixture pairs, as counts per category."
issue = "libviprs/acadsharp-rs-tests#27"

[[warnings]]
pair = "dxf-ascii-binary:ezdxf"
compare = false
reason = "warnings are compared by the per-fixture pairs, as counts per category."
issue = "libviprs/acadsharp-rs-tests#27"

[[exclude]]
pairs = ["dxf-dwg:oracle", "dxf-dwg:acadrust"]
record = "document"
field = "format"
reason = "a DXF against the DWG of the same drawing: the container is the point of the pairing, not a finding."
issue = "libviprs/acadsharp-rs-tests#27"

[[exclude]]
pairs = ["dxf-dwg:oracle", "dxf-dwg:acadrust"]
record = "document"
field = "maintenance_version"
reason = "a DXF header does not carry the DWG maintenance version."
issue = "libviprs/acadsharp-rs-tests#27"

[[exclude]]
pairs = ["dxf:oracle/acadrust", "dxf:ezdxf/acadrust"]
record = "document"
field = "maintenance_version"
reason = "a DXF header carries $ACADMAINTVER, which the oracle and ezdxf report (329 for the AC1032 saves) and acadrust's DXF reader leaves at 0."
issue = "libviprs/acadsharp-rs-tests#96"

# The listed divergences of the DXF lane. Each one is a record both sides read and
# disagree about by exactly the values written here; generated from a run, and
# the comparator is red on any of them that stops diverging or diverges differently.

[[known]]
pair = "dxf-dwg:acadrust"
fixture = "dxf-sample-ac1015-ascii"
record_type = "text"
field = "text"
handles = ["522", "64B"]
a = "\\U+220545,6"
b = "∅45,6"
reason = "The drawing stores the MIF escape \\U+220545,6 (AutoCAD's own DXF twin holds exactly that, and the ASCII and binary files agree). acadrust's DXF reader keeps what the file stores; its DWG reader decodes the escape to the character, so one reader gives two answers for one drawing."
