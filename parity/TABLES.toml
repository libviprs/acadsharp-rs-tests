# ---- records one side lacks, and why that is settled --------------------------------------------

[[known_records]]
pair = "oracle/acadrust"
fixture = "regression_text_zero_height"
record_type = "text"
only_in = "b"
count = 2
reason = "A TEXT and an MTEXT of height 0. ACadSharp 3.7.1 writes the zero and then throws reading it back, so the oracle drops both (and says so with two reader_error warnings) while acadrust reads them and emits text records of height 0.0, which is what the generator wrote. The loss is in ACadSharp's reader, upstream and not ours; tests/regression_claims.rs pins it."
issue = "libviprs/acadsharp-rs-tests#78"

