reason = "AutoCAD stores the start and end angle of a clockwise hatch arc edge as 360 minus each (ezdxf's ArcEdge says so, and acadrust writes and reads it that way since libviprs/acadrust#40). ACadSharp 3.7.1 writes the raw angles into a DXF and reads them raw, so its own files round trip and every reader that follows AutoCAD sees the other half of the circle, and ACadSharp reads a file that follows AutoCAD as the other half. The oracle's reading of the source DWG, which holds the true angles, is the reference."
