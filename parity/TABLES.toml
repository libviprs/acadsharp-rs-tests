reason = "ACadSharp 3.7.1 reads its own AC1015 DWG without the model space records from the source's 183rd on (114 records, 88 of them besides the second table), and acadsharp-rs, which embeds the same reader, loses them too. acadrust reads the same file and has them, and ACadSharp reads AutoCAD's own AC1015 save whole. So either the writer leaves the AC1015 file in a state only acadrust tolerates or the reader cannot follow it; the records are all gone from the first one onward, which fits a break in the entity chain that R13 to R2000 files use, but the loss starts at the first MULTILEADER of model space (ACadSharp's reader logs 'Could not read MULTILEADER number 526' for it and the other fourteen) and drops everything after it, whatever it is; whether the writer should put a MULTILEADER into an AC1015 file at all, or the reader should carry on past one it cannot read, is upstream's to say."
issue = "libviprs/acadsharp-rs-tests#108"

