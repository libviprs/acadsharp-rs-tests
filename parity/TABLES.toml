# ---- the round-trip matrix (R5.3, #29) -----------------------------------------------------
#
# A reader's reading of what a writer wrote, held against the writer's own reading of
# the source (the oracle for ACadSharp, acadrust for acadrust). `w-<writer>:<reader>`
# (src/tables.rs). Every key has an explicit warnings row, and the three document
# fields a rewrite changes by definition are excluded on all of them.

[[warnings]]
pair = "w-acadsharp:oracle"
compare = false
reason = "a reader's notifications are about the file it read and the writer changed the file, so they are not held; the geometry is."
issue = "libviprs/acadsharp-rs-tests#29"

