# ---- what ACadSharp's writers leave out or spell differently (R5.3 findings) -------------------
#
# These are defects of ACadSharp 3.7.1's writers, an upstream project we do not own, so they
# are pinned and reasoned here rather than fixed. A row goes red the day the writer stops doing
# it, which is the cue to remove it. Each issue carries the draft of the upstream report.

[[known_missing]]
pairs = ["w-acadsharp:oracle", "w-acadsharp:acadrust", "w-acadsharp:ezdxf"]
