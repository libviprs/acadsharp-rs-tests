reason = "ACadSharp 3.7.1 escapes every string it writes the way an ASCII DXF does (DxfStreamWriterBase.Write turns a line feed into ^J, a carriage return into ^M, a tab into ^I and a caret into a caret and a space), including into a binary DXF, where strings are NUL-terminated and carry control characters as they are. Its own reader undoes the escape in both containers, so the oracle reads the line feed back; acadrust follows the binary format and returns the caret form literally. AutoCAD's own binary DXF carries the MTEXT paragraph break as the escape \\P, not ^J."
issue = "libviprs/acadsharp-rs-tests#109"

