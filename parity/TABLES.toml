# ---- splines: the closed and periodic flags (#65) --------------------------------------------------

[[known]]
pair = "oracle/acadrust"
fixture = "acadsharp-export-sample"
record_type = "spline"
field = "periodic"
oracle_index = 180
a = true
b = false
reason = "A fit-point spline whose DWG flags1 carry the closed bit (flags1 is 13) and no periodic bit. ACadSharp 3.7.1 derives periodic from that closed bit for a spline built from fit points (Spline.IsPeriodic, the MethodFitPoints branch), and acadrust reports the periodic bit the file does not hold. The DWG stores no periodic bit for a fit-point spline, so nothing in the file settles it: the oracle keeps what ACadSharp says."
issue = "libviprs/acadsharp-rs-tests#65"

