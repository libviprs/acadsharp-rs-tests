# parity/MODEL1_VERDICTS.toml: one row per (fixture, pair) of the model-1 stream.
#
# The words are the ones src/verdict.rs defines and parity/VERDICTS.toml uses.
# `tests/parity_model1.rs` recomputes every verdict from a real run and is red on
# any row that moved, better or worse, until this file changes. A row that is not
# MATCH has a reason and an issue; for KNOWN the reason is that every difference
# is a row of parity/MODEL1.toml, and the issues are the ones those rows name.
#
# `MODEL1_REGEN=1 cargo test --features acadrust --test parity_model1` rewrites it.

[[row]]
fixture = "acadsharp-ac1014"
pair = "oracle/acadrust"
verdict = "KNOWN:17"
reason = "listed in parity/MODEL1.toml"
issue = "libviprs/acadsharp-rs-tests#101, libviprs/acadsharp-rs-tests#98, libviprs/acadsharp-rs-tests#99"
first = 'header $CELTYPE "BYLAYER" vs "ByLayer" [Known]'

