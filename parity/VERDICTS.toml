# parity/VERDICTS.toml: one row per (fixture, pair).
#
# The words are defined in src/verdict.rs. `tests/parity.rs` recomputes every
# verdict from a real run and is red on any row that moved, better or worse,
# until this file changes. A row that is not MATCH has a reason and an issue:
# a committed DIFF is debt, and its issue is where it gets adjudicated.
#
# `PARITY_REGEN=1 cargo test --features acadrust --test parity` rewrites the
# verdicts and `first` from the run, keeps the reason and issue of every row
# whose key it finds, and leaves the rest blank, which the test then refuses.
# There is no `arch` key on a row: verdicts are arch-independent by contract,
# and the [[run]] tables list the runs that confirmed that.

[[run]]
arch = "x86_64"
archive = "3.7.1-viprs.1 (acadsharp-linux-x64.tgz, sha256 4cbdbbdd...)"
acadsharp_rs = "f23f37bd453e02e660ef655faa381c45509d8ac1"
acadrust = "39a11909acf56747f22c7309a0681bef8e6b61b8"
date = "2026-10-16"

[[run]]
arch = "aarch64"
archive = "3.7.1-viprs.1 (acadsharp-linux-arm64.tgz, sha256 dd938ef9...)"
acadsharp_rs = "f23f37bd453e02e660ef655faa381c45509d8ac1"
acadrust = "39a11909acf56747f22c7309a0681bef8e6b61b8"
date = "2026-10-16"

[[row]]
fixture = "acadsharp-ac1014"
pair = "acadsharp/acadrust"
verdict = "DIFF:53"
reason = "acadrust agrees with the oracle where the shim differs: the shim's flattener skips the inserts inside a dimension's block, so the arrowhead geometry is missing from the wire (38 findings); the shim emits an ATTDEF inside a block where schema 1 skips it (and an insert's ATTRIBs come before the block body on the wire) (13 findings); the shim writes a full ellipse as 0..2pi where the oracle keeps the stored start (2 findings); wire 2 anchors a text at its insertion point where schema 1 uses the alignment point (1 finding)"
issue = "libviprs/acadsharp-rs-tests#55, libviprs/acadsharp-rs-tests#54, libviprs/acadsharp-rs-tests#57, libviprs/acadsharp-rs-tests#66"
