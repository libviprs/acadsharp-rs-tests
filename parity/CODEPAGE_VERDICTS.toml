# parity/CODEPAGE_VERDICTS.toml: one row per (authored drawing, reader), R5.4.
#
# 112 drawings (14 code page families, two writers, DWG and ASCII DXF,
# AC1015 and AC1018) read by acadrust, acadsharp-rs, the oracle and ezdxf (DXF
# only). The words are defined in src/verdict.rs; the comparison is on the
# authored text, kind by kind (held, unheld, literal, mif), see tests/parity.rs.
# A row that is not MATCH has a reason and an issue.
