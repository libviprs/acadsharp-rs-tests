# parity/MODEL1.toml: what the model-1 comparison lists instead of failing on.
#
# Two kinds of row, both with a reason and an issue (the loader refuses one
# without either). `known` is a value that differs between two engines or two
# files and is listed, `excluded` is a name an engine cannot produce. Both can be
# scoped to the fixtures they were measured on.
#
# tests/parity_model1.rs holds the lists to the data in both directions: a
# difference or a missing name no row lists is a finding, and a row the run never
# needed is stale and red, so a fix removes its own rows. The rows below were put
# here by a measurement (MODEL1_EXPLAIN=1 prints what a run found).

# ---- known: saved at different moments
[[known]]
names = [
  "$HANDSEED", "$TDINDWG", "$TDUSRTIMER", "$VERSIONGUID"
]
pairs = ["dxf-dwg:acadrust", "dxf-dwg:oracle"]
reason = "the DWG and its AutoCAD DXF twin were written by save_samples.lsp at different moments, so the handle seed, the editing timers, the version GUID and the maintenance release differ by construction"
issue = "libviprs/acadsharp-rs-tests#31"

# ---- known: saved at different moments
[[known]]
names = [
  "$ACADMAINTVER"
]
pairs = ["dxf-dwg:oracle"]
reason = "the DWG and its AutoCAD DXF twin were written by save_samples.lsp at different moments, so the handle seed, the editing timers, the version GUID and the maintenance release differ by construction"
issue = "libviprs/acadsharp-rs-tests#31"

# ---- known: ACadSharp's DXF reader
[[known]]
names = [
  "$HANDSEED"
]
pairs = ["ezdxf/oracle", "oracle/acadrust"]
reason = "ACadSharp's DXF reader reports a handle seed 4 above the one the DXF holds, which ezdxf and acadrust report as written"
issue = "libviprs/acadsharp-rs-tests#99"

# ---- known: ACadSharp's DWG reader (upstream, v3.7.1)
# The rule for these: the oracle says what ACadSharp reads, so an upstream defect is
# listed and never normalised away, and the authority for what the file holds is the
# AutoCAD DXF twin of the drawing plus the other independent DWG reader (acadrust).
# Where both agree against ACadSharp's DWG reader, the defect is ACadSharp's, and the
# line numbers are those of DwgHeaderReader.cs at v3.7.1.
[[known]]
names = [
  "$CELWEIGHT"
]
pairs = ["dxf-dwg:oracle", "oracle/acadrust"]
reason = "DwgHeaderReader.cs:906 casts the lineweight index of the flags word (flags & 0x1F) straight to its LineWeightType, so ByLayer (index 29) is reported as 29 where the DXF twin, ezdxf and acadrust say -1; the DWG stores an index and ACadSharp never maps it to hundredths of a millimetre"
issue = "libviprs/acadsharp-rs-tests#99"

# ---- known: ACadSharp's DWG reader (upstream, v3.7.1)
[[known]]
names = [
  "$EXTNAMES", "$XEDIT"
]
pairs = ["dxf-dwg:oracle", "oracle/acadrust"]
reason = "DwgHeaderReader.cs:914-916 tests a masked flag against 1 (flags & 0x400 == 1, flags & 0x800 == 1), which is never true for a mask that is not bit 0, so both read as false whatever the file holds; the DXF twin, ezdxf and acadrust all say true"
issue = "libviprs/acadsharp-rs-tests#99"

# ---- known: ACadSharp's DWG reader (upstream, v3.7.1)
[[known]]
names = [
  "$MEASUREMENT"
]
pairs = ["dxf-dwg:oracle", "oracle/acadrust"]
reason = "DwgHeaderReader.cs at v3.7.1 never reads the measurement flag, so ACadSharp reports its own default (1, metric) where the DXF twin, ezdxf and acadrust say 0"
issue = "libviprs/acadsharp-rs-tests#99"

# ---- known: ACadSharp's DWG reader (upstream, v3.7.1)
[[known]]
names = [
  "$DWGCODEPAGE"
]
pairs = ["dxf-dwg:oracle", "oracle/acadrust"]
reason = "the same code page, spelled ansi_1252 by ACadSharp's DWG reader (its own code page table) and ANSI_1252 by the DXF, ezdxf and acadrust; a difference of spelling and not of value, listed rather than folded so the oracle stays what ACadSharp says"
issue = "libviprs/acadsharp-rs-tests#99"

# ---- known: ACadSharp's DWG reader (upstream, v3.7.1)
[[known]]
names = [
  "$DIMLTEX1", "$DIMLTEX2", "$DIMLTYPE"
]
pairs = ["dxf-dwg:oracle", "oracle/acadrust"]
reason = "DwgHeaderReader.cs:806-811 reads the three dimension linetype handles into DwgHeaderHandlesCollection and nothing resolves them into the header, so ACadSharp reports the default ByBlock where the DXF twin holds BATTING, TRACKS and ZIGZAG"
issue = "libviprs/acadsharp-rs-tests#99"

# ---- known: ACadSharp's DWG reader (upstream, v3.7.1)
[[known]]
names = [
  "$INTERFERECOLOR"
]
pairs = ["dxf-dwg:oracle"]
reason = "for R2004 DwgHeaderReader.cs:957 assigns the value read for INTERSECTIONCOLOR to InterfereColor (257, by layer), where the DXF holds 1; the R2007 branch (line 1047) reads the colour properly"
issue = "libviprs/acadsharp-rs-tests#99"

# ---- known: not stored by the DXF twin
[[known]]
names = [
  "$DIMALTMZF", "$DIMMZF"
]
pairs = ["dxf-dwg:acadrust", "dxf-dwg:oracle"]
reason = "the AutoCAD DXF of R2010 and later does not write them (ezdxf's skipped list), so ACadSharp's DXF reader reports its default 0.0 where its DWG reader reports the 100.0 the DWG stores; the DWG is the authority, and neither reader is wrong"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: not in the DWG header
[[known]]
names = [
  "$LASTSAVEDBY"
]
pairs = ["dxf-dwg:acadrust", "dxf-dwg:oracle", "oracle/acadrust"]
reason = "the DXF holds the user who saved it, but the DWG header has no slot for $LASTSAVEDBY (the name lives in the summary information section), so neither DWG header reader can read it and ACadSharp reports its own default (ACadSharp) where acadrust reports the empty string; the DXF twin is the only file that stores it in the header"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: a DWG colour the DXF cannot hold
[[known]]
names = [
  "$CECOLOR"
]
pairs = ["dxf-dwg:acadrust", "dxf-dwg:oracle"]
reason = "decided, neither reader is wrong. The CMC in the DWG header of AC1018 and later is index 0 with the colour word 0xC29B42EC, method byte 0xC2 (true colour) and RGB 155,66,236, read the same way by ACadSharp and acadrust. The DXF header can only say group code 62, an index, and AutoCAD wrote 193 (palette entry 124,82,165), which is not the nearest index to that RGB (181), so it cannot be derived from the DWG bytes. The DWG is the authority for a header colour (it is the richer file), and a dxf-dwg pair of $CECOLOR is listed, never excused by rounding; AC1015 stores a plain index and agrees"
issue = "libviprs/acadsharp-rs-tests#100"

# ---- known: $XCLIPFRAME is a byte in the DWG and a bool in the DXF
[[known]]
names = [
  "$XCLIPFRAME"
]
pairs = ["dxf-dwg:acadrust", "dxf-dwg:oracle", "ezdxf/acadrust", "ezdxf/oracle"]
reason = "decided. AutoCAD writes it under group code 290 in all six DXF twins (a bool, which is what ezdxf types it as), ACadSharp's attribute says 280 (an int), so the group-code rule gives bool from ezdxf and int from the others; and the DWG stores a byte (DwgHeaderReader.cs:949, 0 to 2 from R2010) that both DWG readers read as 2 where the DXF holds 0. A bool cannot carry 2, so the DWG is the authority for the value, and the type difference is ACadSharp's attribute against AutoCAD's file. acadrust's DXF reader used to ignore the bool and keep its default (fixed in libviprs/acadrust#31)"
issue = "libviprs/acadsharp-rs-tests#100"

# ---- known: $DIMBLK
[[known]]
names = [
  "$DIMBLK"
]
pairs = ["dxf-dwg:oracle", "oracle/acadrust"]
reason = "decided. The DWG holds a handle to the arrowhead's block, whose name is _BoxBlank, and the DXF holds the arrowhead name BoxBlank (a standard arrowhead's block carries an underscore the variable does not). acadrust resolves the handle and drops the underscore, as the DXF has it (libviprs/acadrust#31); ACadSharp's DWG reader keeps the block's own name, so it differs from the DXF and from acadrust"
issue = "libviprs/acadsharp-rs-tests#100"

# ---- known: version default
[[known]]
names = [
  "$PSTYLEMODE"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014"
]
reason = "the DWG header stores the plot style mode in the flags word of R2000 and later; AC1014 has no such word, so ACadSharp (false) and acadrust (true) report their own defaults. The rule for every version default below: neither reader is wrong and neither is the authority, the file does not say, so the variable is compared only where the file stores it, and the first version that does is named in each row"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: version default
[[known]]
names = [
  "$LENSLENGTH", "$LOFTANG1", "$LOFTANG2", "$LOFTNORMALS", "$LOFTPARAM", "$SHOWHIST",
  "$TIMEZONE"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014", "acadsharp-ac1015", "acadsharp-ac1018", "dxf-sample-ac1015-ascii",
  "dxf-sample-ac1018-ascii"
]
reason = "both DWG header readers read these only in the R2007 block, and the AutoCAD DXF of AC1015 and AC1018 does not write them, so for AC1014 to AC1018 the file does not store them and ACadSharp (0, 0.0) and acadrust (50.0, pi/2, 1, 7, -8000) each report their own defaults; compared only from AC1021"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: version default
[[known]]
names = [
  "$HIDETEXT", "$SORTENTS"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014", "acadsharp-ac1015", "dxf-sample-ac1015-ascii"
]
reason = "both DWG header readers read these only in the R2004 block, and the AutoCAD DXF of AC1015 does not write them, so for AC1014 and AC1015 the file does not store them and ACadSharp (0) and acadrust (1, 127) each report their own defaults; compared only from AC1018"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: version default
[[known]]
names = [
  "$3DDWFPREC", "$PSOLHEIGHT", "$PSOLWIDTH"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014", "acadsharp-ac1015", "acadsharp-ac1018", "dxf-sample-ac1015-ascii",
  "dxf-sample-ac1018-ascii"
]
reason = "both DWG header readers read these only in the R2007 block, and the AutoCAD DXF of AC1015 and AC1018 does not write them, so for AC1014 to AC1018 the file does not store them and ACadSharp (0.0) and acadrust (2.0, 0.25) each report their own defaults; compared only from AC1021"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- known: version default
[[known]]
names = [
  "$INTERFERECOLOR"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014", "acadsharp-ac1015", "dxf-sample-ac1015-ascii", "dxf-sample-ac1018-ascii"
]
reason = "the interference colour is read from the R2007 block and the AutoCAD DXF of AC1015 and AC1018 does not write it, so for these the file does not store it and ACadSharp (1) and acadrust (257) each report their own default; the AC1018 DWG agrees only by coincidence, because ACadSharp's R2004 branch assigns the intersection colour to it (see $INTERFERECOLOR above)"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- known: version default
[[known]]
names = [
  "$DIMUNIT"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1015", "acadsharp-ac1018", "acadsharp-ac1021", "acadsharp-ac1024",
  "acadsharp-ac1027", "acadsharp-ac1032", "dxf-sample-ac1015-ascii", "dxf-sample-ac1018-ascii",
  "dxf-sample-ac1021-ascii", "dxf-sample-ac1024-ascii", "dxf-sample-ac1027-ascii",
  "dxf-sample-ac1032-ascii"
]
reason = "$DIMUNIT is an R13 variable that R2000 replaced by $DIMLUNIT: both DWG header readers read it for R13 and R14 only, and none of the AutoCAD DXF twins writes it, so no file of AC1015 or later stores it and ACadSharp (2) and acadrust (0) each report their own default; AC1014 stores it and agrees"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- known: version default
[[known]]
names = [
  "$OSMODE"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1015", "acadsharp-ac1018", "acadsharp-ac1021", "acadsharp-ac1024",
  "acadsharp-ac1027", "acadsharp-ac1032", "dxf-sample-ac1015-ascii", "dxf-sample-ac1018-ascii",
  "dxf-sample-ac1021-ascii", "dxf-sample-ac1024-ascii", "dxf-sample-ac1027-ascii",
  "dxf-sample-ac1032-ascii"
]
reason = "both DWG header readers read the object snap mode only for R13 and R14, and none of the AutoCAD DXF twins writes it, so no file of AC1015 or later stores it and ACadSharp (4133) and acadrust (0) each report their own default; AC1014 stores it and agrees"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: version default
[[known]]
names = [
  "layer/*.lineweight", "layer/*.plot"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014"
]
reason = "AC1014 stores neither a lineweight nor a plot flag per layer, so ACadSharp reports its defaults (-3, plotted) and acadrust its own (0, not plotted)"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: linetype segment styles
[[known]]
names = [
  "linetype/*.segments[*].style"
]
pairs = ["dxf-dwg:oracle", "ezdxf/oracle", "oracle/acadrust"]
reason = "the text style of a shape or text segment: ACadSharp's DWG reader names an unnamed style unnamed0 where the DXF and acadrust leave it empty, and its DXF reader leaves the style empty where the DXF holds Standard"
issue = "libviprs/acadsharp-rs-tests#116"

# ---- known: linetype segment flags
[[known]]
names = [
  "linetype/*.segments[*].flags"
]
pairs = ["dxf-dwg:oracle", "ezdxf/acadrust", "oracle/acadrust"]
reason = "DXF 74 of an embedded text segment: ACadSharp's DWG reader gives 10 where the DXF holds 2 (to AC1024) or 10 (from AC1027), and acadrust rebuilds 2 from typed data and drops the bit 8"
issue = "libviprs/acadsharp-rs-tests#116"

