# ---- excluded: acadrust, none
[[excluded]]
engine = "acadrust"
names = [
  "$REALWORLDSCALE", "$TDUCREATE", "$TDUUPDATE"
]
reason = "decided: no DWG header slot holds $REALWORLDSCALE, and acadrust's readers keep the local dates only ($TDUCREATE and $TDUUPDATE are the universal-time twins of $TDCREATE and $TDUPDATE, which ACadSharp sets to the time of the read and the oracle does not write), so there is no value for acadrust to hold"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- excluded: acadrust, handle
[[excluded]]
engine = "acadrust"
names = [
  "$PUCSORTHOREF", "$PUCSORTHOVIEW", "$UCSORTHOREF", "$UCSORTHOVIEW"
]
reason = "acadrust holds the UCS table entry of an orthographic view only as a handle and the DXF reader as nothing a record can carry; ACadSharp has no property for it either, so it is the DXF twin's ezdxf against nobody"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- excluded: acadrust, doc
[[excluded]]
engine = "acadrust"
names = [
  "$ACADMAINTVER"
]
reason = "decided: acadrust's header holds the DXF value only (0 for a DWG, whose header has none), while ACadSharp reports the maintenance byte of the DWG file header, which is a different quantity; the adapter writes $ACADVER from the document and leaves this one out"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- excluded: oracle, nothing
[[excluded]]
engine = "oracle"
names = [
  "$INTERSECTIONCOLOR", "$INTERSECTIONDISPLAY", "$OBSCOLOR", "$OBSLTYPE", "$OLESTARTUP",
  "$PUCSORTHOREF", "$PUCSORTHOVIEW", "$REALWORLDSCALE", "$TILEMODELIGHTSYNCH", "$UCSORTHOREF",
  "$UCSORTHOVIEW"
]
reason = "ACadSharp's CadHeader has no property for it (its $OLESTARTUP attribute is commented out in 3.7.1)"
issue = "libviprs/acadsharp-rs-tests#31"

# ---- excluded: oracle, unstable
[[excluded]]
engine = "oracle"
names = [
  "$TDUCREATE", "$TDUUPDATE"
]
reason = "ACadSharp sets it to the time of the read and neither of its readers overwrites it, so the oracle does not write it (docs/MODEL_1.md, values that cannot be frozen)"
issue = "libviprs/acadsharp-rs-tests#31"

# ---- excluded: oracle, a field it cannot produce
[[excluded]]
engine = "oracle"
names = [
  "textstyle/*.annotative"
]
reason = "ACadSharp 3.7.1 has no annotative property on TextStyle (acadrust reads it from the AcadAnnotative xdata of the style), so the oracle writes false and the field is left out; the xdata itself is compared by the xdata kind (#40)"
issue = "libviprs/acadsharp-rs-tests#35"

# ---- excluded: oracle, a field it cannot produce
[[excluded]]
engine = "oracle"
names = [
  "dimstyle/*.annotative"
]
reason = "ACadSharp 3.7.1 does not type the AcadAnnotative xdata of a DIMSTYLE (acadrust reads it from the xdata), so the oracle writes false and the field is left out; the xdata itself is compared by the xdata kind (#40)"
issue = "libviprs/acadsharp-rs-tests#36"

