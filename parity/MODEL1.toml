# ---- known: dimstyle DXF defaults
[[known]]
names = [
  "dimstyle/*.$DIMALTD", "dimstyle/*.$DIMALTTD", "dimstyle/*.$DIMCLRD", "dimstyle/*.$DIMCLRE",
  "dimstyle/*.$DIMCLRT", "dimstyle/*.$DIMDEC", "dimstyle/*.$DIMDLI", "dimstyle/*.$DIMEXE",
