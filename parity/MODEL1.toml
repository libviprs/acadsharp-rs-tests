names = [
  "dictionary/table/*", "dictionary/layout/*"
]
reason = "AutoCAD wrote the DWG and its DXF twin at different moments and the two do not hold the same extension dictionaries or the same entries in them (the dynamic block's and the layers' only in the DWG, the GAS_LINE linetype's only in the DXF, ACAD_XREC_ROUNDTRIP xrecords in the DWG's view_custom and layout Model; ezdxf agrees with the oracle on the DXF and acadrust with the oracle on the DWG), so a difference there is one of the files and not of the reader"
