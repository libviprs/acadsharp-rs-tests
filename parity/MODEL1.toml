# ---- known: ACadSharp keys a dictionary entry by the object's name
[[known]]
names = [
  "dictionary/ACAD_SCALELIST.entries[*].key", "dictionary/ACAD_MLINESTYLE.entries[*].key",
  "dictionary/ACAD_LAYOUT.entries[*].key", "dictionary/ACAD_MATERIAL.entries[*].key",
  "dictionary/ACAD_VISUALSTYLE.entries[*].key"
]
pairs = ["oracle/acadrust", "ezdxf/oracle"]
reason = "ACadSharp adds each dictionary entry under the object's own name (CadDictionaryTemplate.build: this.CadObject.Add(entry.Name, entry)), not under the key the file stores, which acadrust and ezdxf report (A0, A1 for the scales, Standard for the mline style, the upper case keys of the AC1014 save)"
issue = "libviprs/acadsharp-rs-tests#124"

# ---- known: ACadSharp's DXF reader swallows a visual style
[[known]]
names = [
  "dictionary/ACAD_VISUALSTYLE.entries.len", "dictionary/ACAD_VISUALSTYLE.entry_count"
]
pairs = ["ezdxf/oracle", "dxf-dwg:oracle", "oracle/acadrust"]
fixtures = [
  "dxf-sample-ac1015-ascii", "dxf-sample-ac1018-ascii", "dxf-sample-ac1021-ascii",
  "dxf-sample-ac1024-ascii", "dxf-sample-ac1027-ascii", "dxf-sample-ac1032-ascii"
]
reason = "ACadSharp's DXF reader answers true for every code of a VISUALSTYLE (DxfObjectsSectionReader.readVisualStyle), the handle included, so no dictionary resolves the 24 styles and the oracle lists none; ezdxf, acadrust and ACadSharp's own DWG reader list all 24"
issue = "libviprs/acadsharp-rs-tests#125"

# ---- known: the keys of the schemas of a decompose data dictionary
[[known]]
names = [
  "dictionary/AcDsDecomposeData/AcDsSchemas.entries[*].key"
]
pairs = ["dxf-dwg:oracle", "dxf-dwg:acadrust"]
reason = "AutoCAD keys each schema XRECORD of AcDsDecomposeData by a pointer value of the saving process (2869978012640 in the DWG, 2871287105568 in its DXF twin), so two saves of one drawing differ by construction"
issue = "libviprs/acadsharp-rs-tests#31"

# ---- known: the AC1014 save
[[known]]
names = [
  "dictionary/table/*.hard_owner", "dictionary/layout/*.hard_owner",
  "dictionary/ACAD_PLOTSTYLENAME.cloning", "dictionary/ACAD_PLOTSTYLENAME.entries.len",
  "dictionary/ACAD_PLOTSTYLENAME.entry_count"
]
pairs = ["oracle/acadrust"]
fixtures = ["acadsharp-ac1014"]
reason = "on the AC1014 save ACadSharp skips the dictionary byte its reader calls always 0 and reports the hard owner flag false for every extension dictionary where acadrust (and the later saves) say true, and it lists no ACAD_PLOTSTYLENAME entry where acadrust lists one; the save has no DXF twin to say which is right"
issue = "libviprs/acadsharp-rs-tests#128"

# ---- excluded: acadrust's DXF reader keeps no extension dictionary of a table entry or a layout
[[excluded]]
engine = "acadrust"
names = [
  "dictionary/table/*", "dictionary/layout/*"
]
fixtures = [
  "dxf-sample-ac1015-ascii", "dxf-sample-ac1018-ascii", "dxf-sample-ac1021-ascii",
  "dxf-sample-ac1024-ascii", "dxf-sample-ac1027-ascii", "dxf-sample-ac1032-ascii"
]
reason = "acadrust's DXF reader keeps the extension dictionary of an entity and of nothing else (xdic_by_handle is filled during a DWG read only), so the dictionaries of the table entries and the layouts of a DXF are not there"
issue = "libviprs/acadsharp-rs-tests#127"

# ---- excluded: the extension dictionaries of two saves of one drawing
