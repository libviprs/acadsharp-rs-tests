  "$HIDETEXT", "$SORTENTS"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014", "acadsharp-ac1015", "dxf-sample-ac1015-ascii"
]
reason = "the file of this version does not store the variable, so ACadSharp and acadrust each report their own default (ACadSharp 4133 and acadrust 0 for $OSMODE, which no DWG reader reads either)"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: version default
[[known]]
names = [
  "$OSMODE"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1015", "acadsharp-ac1018", "acadsharp-ac1021", "acadsharp-ac1024",
  "acadsharp-ac1027", "acadsharp-ac1032", "dxf-sample-ac1015-ascii", "dxf-sample-ac1021-ascii",
  "dxf-sample-ac1024-ascii", "dxf-sample-ac1027-ascii", "dxf-sample-ac1032-ascii"
]
reason = "the file of this version does not store the variable, so ACadSharp and acadrust each report their own default (ACadSharp 4133 and acadrust 0 for $OSMODE, which no DWG reader reads either)"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: version default
[[known]]
names = [
  "layer/*.lineweight", "layer/*.plot"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014"
]
reason = "AC1014 stores neither a lineweight nor a plot flag per layer, so ACadSharp reports its defaults (-3, plotted) and acadrust its own (0, not plotted)"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- known: linetype segment styles
[[known]]
names = [
  "linetype/*.segments[*].style"
]
pairs = ["dxf-dwg:oracle", "ezdxf/oracle", "oracle/acadrust"]
reason = "the text style of a shape or text segment: ACadSharp's DWG reader names an unnamed style unnamed0 where the DXF and acadrust leave it empty, and its DXF reader leaves the style empty where the DXF holds Standard"
issue = "libviprs/acadsharp-rs-tests#116"

# ---- known: linetype segment flags
[[known]]
names = [
  "linetype/*.segments[*].flags"
]
pairs = ["dxf-dwg:oracle", "ezdxf/acadrust", "oracle/acadrust"]
reason = "DXF 74 of an embedded text segment: ACadSharp's DWG reader gives 10 where the DXF holds 2 (to AC1024) or 10 (from AC1027), and acadrust rebuilds 2 from typed data and drops the bit 8"
issue = "libviprs/acadsharp-rs-tests#116"

# ---- known: dimstyle version default
[[known]]
names = [
  "dimstyle/*.$DIMFXL", "dimstyle/*.$DIMJOGANG"
]
pairs = ["dxf-dwg:acadrust", "oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014", "acadsharp-ac1015", "acadsharp-ac1018", "dxf-sample-ac1015-ascii"
]
reason = "the DWG of this version does not store the value, so ACadSharp and acadrust each report their own default"
issue = "libviprs/acadsharp-rs-tests#122"

# ---- known: dimstyle version default
[[known]]
names = [
  "dimstyle/*.$DIMTIH"
]
pairs = ["dxf-dwg:acadrust", "oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014", "dxf-sample-ac1015-ascii"
]
reason = "the DWG of this version does not store the value, so ACadSharp and acadrust each report their own default"
issue = "libviprs/acadsharp-rs-tests#122"

# ---- known: dimstyle version default
[[known]]
names = [
  "dimstyle/*.$DIMBLK", "dimstyle/*.$DIMLWD", "dimstyle/*.$DIMLWE", "dimstyle/*.$DIMSE1"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014"
]
reason = "the DWG of this version does not store the value, so ACadSharp and acadrust each report their own default"
issue = "libviprs/acadsharp-rs-tests#122"

# ---- known: dimstyle $DIMFIT
[[known]]
names = [
  "dimstyle/*.$DIMFIT"
]
pairs = ["dxf-dwg:oracle", "oracle/acadrust"]
reason = "ACadSharp's DWG reader gives 3 for the R13 variable $DIMFIT that R2000 replaced by $DIMATFIT, and every other reader gives 0"
issue = "libviprs/acadsharp-rs-tests#122"

# ---- known: dimstyle DXF defaults
[[known]]
names = [
  "dimstyle/*.$DIMALTD", "dimstyle/*.$DIMALTTD", "dimstyle/*.$DIMCLRD", "dimstyle/*.$DIMCLRE",
  "dimstyle/*.$DIMCLRT", "dimstyle/*.$DIMDEC", "dimstyle/*.$DIMDLI", "dimstyle/*.$DIMEXE",
  "dimstyle/*.$DIMEXO", "dimstyle/*.$DIMGAP", "dimstyle/*.$DIMPOST", "dimstyle/*.$DIMTAD",
  "dimstyle/*.$DIMTDEC", "dimstyle/*.$DIMTIH", "dimstyle/*.$DIMTOH", "dimstyle/*.$DIMTOLJ",
  "dimstyle/*.$DIMTZIN", "dimstyle/*.$DIMZIN"
]
pairs = ["dxf-dwg:acadrust", "dxf-dwg:oracle"]
reason = "AutoCAD writes only the codes that differ from a default, and ACadSharp's and acadrust's DXF readers substitute their own (the ISO set) where the DWG of the same drawing holds AutoCAD's"
issue = "libviprs/acadsharp-rs-tests#122"

# ---- known: dimstyle DXF defaults
[[known]]
names = [
  "dimstyle/*.$DIMSAH"
]
pairs = ["dxf-dwg:acadrust", "oracle/acadrust"]
reason = "AutoCAD writes only the codes that differ from a default, and ACadSharp's and acadrust's DXF readers substitute their own (the ISO set) where the DWG of the same drawing holds AutoCAD's"
issue = "libviprs/acadsharp-rs-tests#122"

# ---- known: dimstyle DXF defaults
[[known]]
names = [
  "dimstyle/*.$DIMAPOST"
]
pairs = ["dxf-dwg:oracle", "oracle/acadrust"]
reason = "AutoCAD writes only the codes that differ from a default, and ACadSharp's and acadrust's DXF readers substitute their own (the ISO set) where the DWG of the same drawing holds AutoCAD's"
issue = "libviprs/acadsharp-rs-tests#122"

# ---- known: dimstyle $DIMBLK
[[known]]
names = [
  "dimstyle/*.$DIMBLK"
]
pairs = ["ezdxf/acadrust", "ezdxf/oracle"]
reason = "acadrust gives the empty string for the arrow block $DIMBLK of a style whose DXF holds a block handle, where ezdxf and ACadSharp give the block's name"
issue = "libviprs/acadsharp-rs-tests#122"

# ---- known: AC1014 upper case
[[known]]
names = [
  "$CELTYPE", "$TEXTSTYLE"
]
pairs = ["oracle/acadrust"]
fixtures = [
  "acadsharp-ac1014"
]
reason = "AC1014 stores table names upper-cased and acadrust reports the table's own spelling"
issue = "libviprs/acadsharp-rs-tests#101"

# ---- excluded: acadrust, none
[[excluded]]
engine = "acadrust"
names = [
  "$3DDWFPREC", "$CSHADOW", "$DGNFRAME", "$DIMALTMZF", "$DIMALTMZS", "$DIMARCSYM", "$DIMAZIN",
  "$DIMFIT", "$DIMFXL", "$DIMFXLON", "$DIMJOGANG", "$DIMMZF", "$DIMMZS", "$DIMTFILL",
  "$DIMTFILLCLR", "$DIMTXTDIRECTION", "$DIMUNIT", "$DWFFRAME", "$INTERFERECOLOR",
  "$LIGHTGLYPHDISPLAY", "$PELLIPSE", "$PSOLHEIGHT", "$PSOLWIDTH", "$PUCSBASE", "$PUCSORGBACK",
  "$PUCSORGBOTTOM", "$PUCSORGFRONT", "$PUCSORGLEFT", "$PUCSORGRIGHT", "$PUCSORGTOP",
  "$REALWORLDSCALE", "$TDUCREATE", "$TDUUPDATE", "$TILEMODELIGHTSYNCH", "$UCSORGBACK",
  "$UCSORGBOTTOM", "$UCSORGFRONT", "$UCSORGLEFT", "$UCSORGRIGHT", "$UCSORGTOP", "$UNITMODE"
]
reason = "acadrust's HeaderVariables has no field for it"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- excluded: acadrust, handle
[[excluded]]
engine = "acadrust"
names = [
  "$DIMLTEX1", "$DIMLTEX2", "$DIMLTYPE", "$DIMTXSTY", "$PUCSORTHOREF", "$PUCSORTHOVIEW",
  "$UCSORTHOREF", "$UCSORTHOVIEW"
]
reason = "acadrust holds it only as a handle, and the adapter does not resolve handles to names yet"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- excluded: acadrust, doc
[[excluded]]
engine = "acadrust"
names = [
  "$ACADMAINTVER", "$ACADVER"
]
reason = "acadrust keeps it on the document, not in HeaderVariables"
issue = "libviprs/acadsharp-rs-tests#102"

# ---- excluded: oracle, nothing
[[excluded]]
engine = "oracle"
names = [
  "$INTERSECTIONCOLOR", "$INTERSECTIONDISPLAY", "$OBSCOLOR", "$OBSLTYPE", "$OLESTARTUP",
  "$PUCSORTHOREF", "$PUCSORTHOVIEW", "$REALWORLDSCALE", "$TILEMODELIGHTSYNCH", "$UCSORTHOREF",
  "$UCSORTHOVIEW"
]
reason = "ACadSharp's CadHeader has no property for it (its $OLESTARTUP attribute is commented out in 3.7.1)"
issue = "libviprs/acadsharp-rs-tests#31"

# ---- excluded: oracle, unstable
[[excluded]]
engine = "oracle"
names = [
  "$TDUCREATE", "$TDUUPDATE"
]
reason = "ACadSharp sets it to the time of the read and neither of its readers overwrites it, so the oracle does not write it (docs/MODEL_1.md, values that cannot be frozen)"
issue = "libviprs/acadsharp-rs-tests#31"

# ---- excluded: oracle, a field it cannot produce
[[excluded]]
engine = "oracle"
names = [
  "textstyle/*.annotative"
]
reason = "ACadSharp 3.7.1 has no annotative property on TextStyle (acadrust reads it from the AcadAnnotative xdata of the style), so the oracle writes false and the field is left out; the xdata itself is compared by the xdata kind (#40)"
issue = "libviprs/acadsharp-rs-tests#35"

# ---- excluded: oracle, a field it cannot produce
[[excluded]]
engine = "oracle"
names = [
  "dimstyle/*.annotative"
]
reason = "ACadSharp 3.7.1 does not type the AcadAnnotative xdata of a DIMSTYLE (acadrust reads it from the xdata), so the oracle writes false and the field is left out; the xdata itself is compared by the xdata kind (#40)"
issue = "libviprs/acadsharp-rs-tests#36"

# ---- excluded: ezdxf, not written by the DXF of these versions
[[excluded]]
engine = "ezdxf"
names = [
  "$3DDWFPREC", "$BLIPMODE", "$CAMERADISPLAY", "$CAMERAHEIGHT", "$CSHADOW", "$DGNFRAME",
  "$DIMALTMZF", "$DIMALTMZS", "$DIMARCSYM", "$DIMASSOC", "$DIMFIT", "$DIMFXL", "$DIMFXLON",
  "$DIMJOGANG", "$DIMLTEX1", "$DIMLTEX2", "$DIMLTYPE", "$DIMMZF", "$DIMMZS", "$DIMTFILL",
  "$DIMTFILLCLR", "$DIMTXTDIRECTION", "$DIMUNIT", "$DWFFRAME", "$FACETRES", "$HALOGAP",
  "$HIDETEXT", "$INDEXCTL", "$INTERFERECOLOR", "$INTERSECTIONCOLOR", "$INTERSECTIONDISPLAY",
  "$LASTSAVEDBY", "$LATITUDE", "$LENSLENGTH", "$LIGHTGLYPHDISPLAY", "$LOFTANG1", "$LOFTANG2",
  "$LOFTMAG1", "$LOFTMAG2", "$LOFTNORMALS", "$LOFTPARAM", "$LONGITUDE", "$NORTHDIRECTION",
  "$OBSCOLOR", "$OBSLTYPE", "$OSMODE", "$PELLIPSE", "$PROJECTNAME", "$PSOLHEIGHT",
  "$PSOLWIDTH", "$REQUIREDVERSIONS", "$SHADOWPLANELOCATION", "$SHOWHIST", "$SOLIDHIST",
  "$SORTENTS", "$STEPSIZE", "$STEPSPERSEC", "$TDCREATE", "$TIMEZONE", "$XCLIPFRAME"
]
fixtures = [
  "dxf-sample-ac1015-ascii"
]
reason = "the AutoCAD DXF of this version does not write it (or, for $TDCREATE, ezdxf stamps it with the time of the read and tools/model1.py leaves it out)"
