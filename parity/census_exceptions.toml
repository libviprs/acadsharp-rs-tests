[[row]]
reader = "acadsharp"
kind = "unexpected"
handle = "705"
reason = "An attribute of a block reference. Wire 2 emits an insert's ATTRIBs before the block body with the expansion flag clear, so the leaf handle looks top level, and AutoCAD's census lists the entities of a block table record and not the attributes of its references."
issue = "libviprs/acadsharp-rs-tests#22"

