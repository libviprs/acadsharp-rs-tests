# What may differ between the oracle's output for the AC1032 save and the other
# saves of the same drawing (R3.4, acadsharp-rs-tests#24).
#
# Read by `src/invariance.rs`, held by `tests/oracle_invariance.rs`: every
# difference the comparator finds has a row here, and every row is still a
# difference. A row with no reason, or no issue (`owner/repo#N`), is refused.
#
# `[[exception]]` is where the format cannot carry the same thing, so the saves
# are right to differ. When AutoCAD's own DXF of the save holds the value, the
# row names it in `ground_truth` and the test checks the twin really does.
# `[[failure]]` is a reader bug, pinned so it cannot move unseen. It is not an
# excuse: the fix retires the row.
#
# Records are named by their index in the AC1032 stream, which is the one
# coordinate that cannot shift. `a` is the AC1032 value, `b` the other save's.
#
# Written by `cargo test --test oracle_invariance print_the_list -- --ignored
# --nocapture`, then read by a person; regenerate it only on purpose.

baseline = "acadsharp-ac1032"

[[exception]]
fixture = "acadsharp-ac1014"
record = 42
record_type = "text"
field = "style"
a = "custom_text_style"
b = "CUSTOM_TEXT_STYLE"
reason = "AC1014 stores table names upper-cased, so the style of a text reads STANDARD where later saves read Standard. The format cannot carry the case. AC1014 has no DXF twin, so this one is argued from the format and not shown."
issue = "libviprs/acadsharp-rs-tests#24"

