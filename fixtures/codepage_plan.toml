# The code page fixtures (R5.4, acadsharp-rs-tests#30): one drawing per code page
# family, written at AC1015 and AC1018 by both writers, as a DWG and as a pre-2007
# ASCII DXF (which carries the same bytes and $DWGCODEPAGE).
#
# Read by tools/regenerate_codepage.py (which makes the files), src/codepage.rs and
# tests/codepage.rs. A drawing is a model space of TEXT entities, in this order, and
# the authored strings are what every reader is compared against, not another reader:
#
#   held      characters the page holds
#   unheld    a character it does not (the writer has to escape it, or lose it)
#   literal   a literal \U+XXXX escape of a character the page *does* hold: AutoCAD's
#             own partition (escape what the page cannot hold, leave the rest literal;
#             handles 634 and 63E of the sample drawing) says it comes back as written
#   mif       a \M+nXXXX escape (n = 1 Shift-JIS, 2 Big5, 3 KS C 5601, 5 GB 2312), for
#             the CJK families
#
# DOS and ISO pages stay out: acadrust maps most of them to stand-ins
# (src/io/dxf/code_page.rs), so a DOS row would be a known divergence from day one and
# belongs with acadrust#9.

versions = ["AC1015", "AC1018"]
writers = ["acadsharp", "acadrust"]
containers = ["dwg", "dxf-ascii"]

[[family]]
page = 1250
header = "ANSI_1250"
held = "ĄĆĘŁŃÓŚŹŻ ąćęłńóśźż"
