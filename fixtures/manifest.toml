# Canonical DWG fixture manifest.
#
# This file is the single source of truth. The fetch tool reads it, the Rust
# integrity test reads it, and CI reads it. Nothing else records a sha256, so
# there is no second copy to drift.
#
# One corpus for every engine that reads it. A `[[fixture]]` row is a DWG the
# oracle reads, which is what four things iterate and expect (the oracle's own
# manifest reader, tools/regenerate_reference.py, src/fixtures.rs and the fetch
# tool's signature check), so it stays exactly that. Every other role has a
# sibling table with the same provenance fields:
#
#   [[fixture]]      a drawing the oracle reads and freezes; `tier` is A
#                    (AutoCAD-authored, decision grade), B (regression grade,
#                    written by ACadSharp's own DwgWriter) or C (stress: both
#                    engines open it and agree on counts)
#   [[refusal]]      a drawing the oracle is expected to refuse, with the exit
#                    code it refuses it with
#   [[recording]]    libviprs-dep's six-decimal `.txt` recording of a drawing
#   [[oracle_input]] AutoCAD's own DXF twins
#   [[census]]       AutoCAD's recorded object census (one row per distinct
#                    blob: upstream stores five of the saves' trees as the same
#                    bytes under five names, and those are `also_source_*`)
#
# Every row names its `source`, and each source has its own commit and host
# prefix under [sources.*]. A drawing meant to hold no geometry carries
# `no_primitives = "<reason>"`; without it a reference holding none is refused.
#
# Vendored, all of it. A fetched tier would make `tests/fixture_integrity.rs`
# need the network or skip, and a skip is the thing this corpus is removing. The
# total under fixtures/ is 42 MB (30 MB of it the 26 DXF twins and the census),
# against the 50 MB threshold fixtures/README.md sets for moving to LFS. When
# that threshold is reached the drawings move; the DXF twins are the first thing
# to ask whether they need to be here at all.
#
# Nothing here is generated at run time. `tools/fetch_acadsharp_fixtures.py`
# will verify against these values and will never rewrite them: a changed hash
# upstream is a decision for a human, not a silent update.

[upstream]
repository = "https://github.com/DomCR/ACadSharp"
version = "v3.7.1"
commit = "d7dc111023477d8a9fffc2153139459c95b4f345"
license = "MIT"
license_file = "LICENSE-ACadSharp.txt"
# Tagged 2026-08-17. Every source_url below is pinned to this commit, never to
# a branch: a branch URL would make the corpus change under us without a diff.

# Where each kind of row comes from. Every row names its `source`, and the
# fetch tool's host and URL-prefix allowlist is per source: a row cannot borrow
# another source's commit or another source's host.
[sources.acadsharp]
repository = "https://github.com/DomCR/ACadSharp"
commit = "d7dc111023477d8a9fffc2153139459c95b4f345"
url_prefix = "https://raw.githubusercontent.com/DomCR/ACadSharp/"
license = "MIT"
license_file = "LICENSE-ACadSharp.txt"

[sources.libviprs_dep]
repository = "https://github.com/libviprs/libviprs-dep"
# On libviprs-dep's main (`git merge-base --is-ancestor` says so in a fresh
# clone). 0d475bf is the commit this was before main was rewritten with
# identical trees; it is not pinned anywhere.
commit = "bc351a906d9085f256fb2226fd6050f72e2d3325"
url_prefix = "https://raw.githubusercontent.com/libviprs/libviprs-dep/"
license = "MIT"
license_file = "LICENSE-libviprs-dep.txt"

[sources.generated]
repository = "https://github.com/libviprs/acadsharp-rs-tests"
# Generated by this repository's own generator (reference/ACadSharp.Generator), so
# nothing here is downloadable and `fetch` skips it: `generated = true`. The pin is
# the commit that contains the generator code that wrote the bytes (the merge of
# the catalog PR), which is on this repository's main.
commit = "784d3cb7ed52ad627bc65f01902a7e405d68727f"
url_prefix = "https://raw.githubusercontent.com/libviprs/acadsharp-rs-tests/"
license = "MIT"
license_file = "LICENSE-acadsharp-rs-tests.txt"
generated = true

