# Upstream test parity manifest.
#
# ACadSharp's own test suite is the closest thing to a specification of what a
# DWG reader has to do, so this records where every one of its test files
# stands relative to this suite. It classifies; it does not port. H4.2
# (libviprs/acadsharp-rs-tests#10) turns rows into real Rust tests.
#
# The point is that upstream coverage stops drifting silently. A bump that adds
# a test file fails `tools/parity_inventory.py` until somebody decides what that
# file means for us, which is the gate H3.4 wires into every proposed bump.
#
# Statuses, explained in full in README.md:
#   mirrored            a Rust test reproduces it; `rust` lists the files
#   differential        covered end to end by the JSONL comparison with the oracle
#   native_conformance  checked against ACadSharp itself, not through rendering
#   not_applicable      out of scope, with the reason why
#
# `not_applicable` never counts toward coverage. That is the whole reason the
# status exists separately from the other three: writer suites and DXF suites
# are not gaps, and a coverage number that counted them would drift downward
# every time upstream added a writer test and tell nobody anything.

[upstream]
repository = "https://github.com/DomCR/ACadSharp"
version = "v3.7.1"
commit = "d7dc111023477d8a9fffc2153139459c95b4f345"
# Test files live here, relative to the repository root. Everything below is
# relative to this prefix.
test_root = "src/ACadSharp.Tests"

# Upstream's own recorded document trees, one per DWG generation, sitting
# alongside the test sources rather than under `samples/`. They are a second
# oracle: a baseline ACadSharp itself is held to. The reference generator may
# consult them, which is why they are recorded here rather than left implicit.
[[baseline]]
kind = "document_tree"
files = [
  "Data/sample_AC1014_tree.json",
  "Data/sample_AC1015_tree.json",
  "Data/sample_AC1018_tree.json",
  "Data/sample_AC1021_tree.json",
  "Data/sample_AC1024_tree.json",
  "Data/sample_AC1027_tree.json",
  "Data/sample_AC1032_tree.json",
]
status = "native_conformance"
reason = "upstream's own expected document structure per generation, usable as a second oracle for the .NET reference"

